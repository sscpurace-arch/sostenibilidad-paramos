name: Keep Supabase Alive

# Supabase pausa los proyectos gratuitos tras 7 días sin actividad. Un ping
# de escritura dos veces por semana NO bastó: el proyecto se pausó el
# 2026-09-23 con pings exitosos el 14, 17 y 21. Ahora corre todos los días y
# toca varias partes del proyecto (base de datos, autenticación y
# almacenamiento), no solo una tabla. Es una mitigación, no una garantía: la
# única forma segura de evitar la pausa es el plan Pro.
on:
  schedule:
    - cron: '0 11 * * *'   # 06:00 hora de Colombia, todos los días
  workflow_dispatch:

jobs:
  ping-supabase:
    runs-on: ubuntu-latest
    steps:
      - name: Escritura real en la base (keep_alive_ping)
        run: |
          curl -f -sS -X POST "${{ secrets.SUPABASE_URL }}/rest/v1/keep_alive_ping" \
          -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
          -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}" \
          -H "Content-Type: application/json" \
          -H "Prefer: resolution=merge-duplicates,return=minimal" \
          -d "{\"id\":1,\"pinged_at\":\"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"}"

      - name: Lectura de tablas reales (indicadores, productores)
        run: |
          for t in indicadores productores; do
            curl -f -sS "${{ secrets.SUPABASE_URL }}/rest/v1/$t?select=id&limit=5" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}" > /dev/null
          done

      - name: Autenticación (estado del servicio)
        run: |
          curl -f -sS "${{ secrets.SUPABASE_URL }}/auth/v1/settings" \
          -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" > /dev/null

      - name: Almacenamiento (buckets)
        # Puede responder 400 con la llave pública; solo importa que el servicio conteste
        run: |
          curl -sS -o /dev/null -w "storage: %{http_code}\n" "${{ secrets.SUPABASE_URL }}/storage/v1/bucket" \
          -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
          -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}"
