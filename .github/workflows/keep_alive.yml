name: Keep Supabase Alive

on:
  schedule:
    # Se ejecuta a las 00:00 UTC los lunes y jueves (1 y 4)
    - cron: '0 0 * * 1,4'
  workflow_dispatch: # Permite ejecución manual para pruebas

jobs:
  ping-supabase:
    runs-on: ubuntu-latest
    steps:
      - name: Write-ping Supabase table 'keep_alive_ping'
        run: |
          curl -f -X POST "${{ secrets.SUPABASE_URL }}/rest/v1/keep_alive_ping" \
          -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
          -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}" \
          -H "Content-Type: application/json" \
          -H "Prefer: resolution=merge-duplicates,return=representation" \
          -d "{\"id\":1,\"pinged_at\":\"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"}"
